name: Daily visits report

on:
  schedule:
    # 12:00 UTC = 8:00am AST (Puerto Rico, no DST to account for)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  call-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-visits-report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty or not set."
            exit 1
          fi
          url="https://www.stratosconsultingpr.com/api/daily-visits-report?secret=${CRON_SECRET}"
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" "$url")
          echo "Response ($status):"
          cat /tmp/response.txt
          echo ""
          if [ "$status" -ge 300 ]; then
            echo "::error::daily-visits-report returned HTTP $status"
            exit 1
          fi
